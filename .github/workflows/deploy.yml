name: CI/CD — Build & Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: Test suite
        run: npm test -- --run

      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_TABLE: ${{ vars.VITE_SUPABASE_TABLE }}
          VITE_OSRM_URL: ${{ secrets.VITE_OSRM_URL }}
          VITE_ORS_API_KEY: ${{ secrets.VITE_ORS_API_KEY }}
          VITE_ORS_URL: ${{ vars.VITE_ORS_URL }}
          VITE_TRAFFIC_RUSH_HOUR_FACTOR: ${{ vars.VITE_TRAFFIC_RUSH_HOUR_FACTOR }}
          VITE_MAP_CENTER_LAT: ${{ vars.VITE_MAP_CENTER_LAT }}
          VITE_MAP_CENTER_LNG: ${{ vars.VITE_MAP_CENTER_LNG }}
          VITE_MAP_ZOOM: ${{ vars.VITE_MAP_ZOOM }}
          VITE_ARRIVAL_RADIUS_M: ${{ vars.VITE_ARRIVAL_RADIUS_M }}
          VITE_VISIT_GEOFENCE_RADIUS_M: ${{ vars.VITE_VISIT_GEOFENCE_RADIUS_M }}
          VITE_NEAREST_SEARCH_RADIUS_KM: ${{ vars.VITE_NEAREST_SEARCH_RADIUS_KM }}
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
          VITE_APP_VERSION: ${{ vars.VITE_APP_VERSION }}
          VITE_APP_ENV: ${{ vars.VITE_APP_ENV }}
          VITE_ENABLE_OFFLINE: ${{ vars.VITE_ENABLE_OFFLINE }}
          VITE_ENABLE_TOUR_OPTIMIZATION: ${{ vars.VITE_ENABLE_TOUR_OPTIMIZATION }}
          VITE_ENABLE_SHEETS_SYNC: ${{ vars.VITE_ENABLE_SHEETS_SYNC }}
          # Chargement spatial par emprise (opt-in) — nécessite l'exécution
          # préalable de supabase/add_spatial_bbox.sql. Variable absente => flag
          # à false côté app (config.js), comportement historique inchangé.
          VITE_ENABLE_BBOX_LOADING: ${{ vars.VITE_ENABLE_BBOX_LOADING }}
          VITE_BBOX_MAX_ROWS: ${{ vars.VITE_BBOX_MAX_ROWS }}
          # Rendu des marqueurs en couches WebGL natives (opt-in) — à valider
          # sur appareil réel. Variable absente => rendu DOM historique.
          VITE_ENABLE_WEBGL_MARKERS: ${{ vars.VITE_ENABLE_WEBGL_MARKERS }}
          # Bâtiments 3D (fill-extrusion, zoom >= 15). Défaut côté app = activé ;
          # mettre la variable à "false" pour le couper sur parc bas de gamme.
          VITE_ENABLE_3D_BUILDINGS: ${{ vars.VITE_ENABLE_3D_BUILDINGS }}
          # Suivi des erreurs terrain (opt-in) — après supabase/add_client_errors.sql.
          VITE_ENABLE_ERROR_REPORTING: ${{ vars.VITE_ENABLE_ERROR_REPORTING }}
          # Consentement des personnes recensées (opt-in) — après supabase/add_consent.sql.
          VITE_ENABLE_CONSENT: ${{ vars.VITE_ENABLE_CONSENT }}
          VITE_CONSENT_CONTACT: ${{ vars.VITE_CONSENT_CONTACT }}

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./dist

  e2e:
    # Parcours agent de bout en bout (connexion, formulaire, photo, envoi)
    # sur téléphone simulé, clair + sombre. Backend Supabase simulé : aucune
    # clé ni donnée réelle. Bloque le déploiement en cas d'échec.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
